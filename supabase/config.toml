project_id = "hsw-quote"

[auth]
enable_signup = false          # users are created only by the admin, through the manage-user function

[auth.email]
otp_length = 6
otp_expiry = 600

[functions.set-store-password]
verify_jwt = false             # checks the caller is the admin itself (getUser)

[functions.send-document]
verify_jwt = false             # checks the user token itself (getUser)

[functions.record-payment]
verify_jwt = false             # checks the user token itself (getUser) so it can return clean errors
