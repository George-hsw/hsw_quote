name: Deploy Supabase (database + functions)

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push
      - run: |
          supabase secrets set RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" MAIL_FROM="${{ secrets.MAIL_FROM }}"
          supabase functions deploy request-code --no-verify-jwt
          supabase functions deploy record-payment --no-verify-jwt
          supabase functions deploy send-document --no-verify-jwt
