name: Deploy Supabase (database + functions)

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      # The CLI defaults to a local database and asks before changing production: aim it at the linked project, answer yes.
      - run: supabase db push --remote --yes
      - env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          # Email secrets are optional until the Resend sender is ready; skip them when empty.
          if [ -n "$RESEND_API_KEY" ] && [ -n "$MAIL_FROM" ]; then
            supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" MAIL_FROM="$MAIL_FROM"
          else
            echo "RESEND_API_KEY / MAIL_FROM not set: skipping email secrets"
          fi
          supabase functions deploy record-payment --no-verify-jwt --yes
          supabase functions deploy send-document --no-verify-jwt --yes
          supabase functions deploy set-store-password --no-verify-jwt --yes
          supabase functions deploy manage-user --no-verify-jwt --yes
